name: Tsunami watch

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may delay scheduled runs by several minutes
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tsunami-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      LOCATIONS_JSON: ${{ secrets.LOCATIONS_JSON }}
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - name: Send test notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: python3 checker/check.py --force-test

      - name: Check feeds and notify
        run: python3 checker/check.py

      - name: Save state
        id: commit
        run: |
          git config user.name "tsunami-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checker/state.json data/alerts.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update alerts [skip ci]"
            git pull --rebase --quiet || true
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: ${{ needs.check.outputs.changed == 'true' || github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
